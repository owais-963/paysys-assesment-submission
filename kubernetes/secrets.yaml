# TEMPLATE ONLY -- do not put a real password in this file or commit one.
#
# CHANGE_ME below is a placeholder. Before applying, either:
#   1. Edit a local, untracked copy of this file with the real password, or
#   2. Skip this file entirely and create the Secret imperatively instead:
#        kubectl create secret generic minipay-db-credentials \
#          --namespace minipay \
#          --from-literal=DB_PASSWORD='<real password>'
#      (option 2 never writes the real value to disk in this repo at all)
#
# DB_PASSWORD is consumed by the minipay-api Deployment; the same value is
# also read as POSTGRES_PASSWORD by the minipay-db StatefulSet, so both
# sides authenticate with the same credential from a single Secret.
apiVersion: v1
kind: Secret
metadata:
  name: minipay-db-credentials
  namespace: minipay
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
