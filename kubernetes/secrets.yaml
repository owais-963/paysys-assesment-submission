# TEMPLATE ONLY -- do not put real secret values in this file or commit them.
#
# CHANGE_ME below are placeholders. Before applying, either:
#   1. Edit a local, untracked copy of this file with the real values, or
#   2. Skip this file entirely and create the Secret imperatively instead:
#        kubectl create secret generic minipay-db-credentials \
#          --namespace minipay \
#          --from-literal=DB_PASSWORD='<real password>' \
#          --from-literal=API_KEY='<real api key, e.g. openssl rand -hex 32>'
#      (option 2 never writes the real values to disk in this repo at all)
#
# Despite the name, this Secret now holds two distinct credentials:
#   - DB_PASSWORD: consumed by the minipay-api Deployment, and also read as
#     POSTGRES_PASSWORD by the minipay-db StatefulSet, so both sides
#     authenticate with the same credential from one place.
#   - API_KEY: the shared secret MiniPay's API requires via the X-API-Key
#     header on every /api/* request (see MiniPay/README.md, app/auth.py).
apiVersion: v1
kind: Secret
metadata:
  name: minipay-db-credentials
  namespace: minipay
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  API_KEY: "CHANGE_ME"
